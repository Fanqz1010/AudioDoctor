name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: swift build -c release
      - name: Generate stereo test audio
        run: |
          python3 - <<'PY'
          import math, struct, wave
          path = "test-stereo.wav"
          rate = 44100
          frames = 44100
          with wave.open(path, "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              for i in range(frames):
                  value = int(18000 * math.sin(2 * math.pi * 440 * i / rate))
                  w.writeframesraw(struct.pack("<hh", value, value))
          PY
      - name: Run audio CLI smoke tests
        run: |
          BINARY=".build/release/AudioDoctor"
          "$BINARY" analyze test-stereo.wav > analysis.json
          "$BINARY" convert test-stereo.wav test-51.wav surround51
          "$BINARY" convert test-stereo.wav test-ambi.wav ambix
          afinfo test-51.wav | grep "6 ch"
          afinfo test-ambi.wav | grep "4 ch"
          python3 scripts/audio_analyzer.py --no-stats test-stereo.wav | grep "44100 Hz"
          mkdir -p batch-input/nested
          cp test-stereo.wav batch-input/nested/
          "$BINARY" batch batch-input batch-output analyze
          python3 - <<'PY'
          import csv
          from pathlib import Path
          reports = list(Path("batch-output").glob("*.csv"))
          assert len(reports) == 1, reports
          with reports[0].open(encoding="utf-8-sig") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 1, rows
          assert rows[0]["状态"] == "成功"
          assert rows[0]["AI伪影总分"], rows[0]
          html_reports = list(Path("batch-output").glob("*.html"))
          assert len(html_reports) == 1, html_reports
          assert "<h1>批量音频体检报告</h1>" in html_reports[0].read_text(encoding="utf-8")
          PY
